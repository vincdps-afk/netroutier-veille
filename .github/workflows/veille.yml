name: Veille Supabase

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:
    inputs:
      simuler_panne:
        description: 'Test : simuler une panne pour recevoir un e-mail'
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  veille:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Vérifier que la base répond
        env:
          URL: https://jcestoqtyjgesberrhhl.supabase.co
          KEY: sb_publishable_hplT8xXSFa3iTA-0UzYMgA_xdf8J_Ym
          SIMULER: ${{ github.event.inputs.simuler_panne }}
        run: |
          [ "$SIMULER" = "true" ] && URL="https://panne-simulee.invalid"
          MAXT=${MAXT:-15}; PAUSE=${PAUSE:-20}
          code() { curl -s -o /dev/null -w '%{http_code}' --max-time "$MAXT" -H "apikey: $KEY" "$1" || true; }
          ok=0
          for i in 1 2 3; do
            a=$(code "$URL/auth/v1/health")
            b=$(code "$URL/rest/v1/profiles?select=id&limit=1")
            echo "Essai $i : connexion=$a base=$b"
            if [ "$a" = "200" ] && [ "$b" -ge 100 ] && [ "$b" -lt 500 ]; then ok=1; break; fi
            [ "$i" -lt 3 ] && sleep "$PAUSE"
          done
          if [ "$ok" != "1" ]; then echo "ERREUR : la base Supabase ne répond pas."; exit 1; fi
          echo "La base répond normalement."
      - name: Activité mensuelle (évite la mise en pause par GitHub)
        if: always()
        run: |
          last=$(git log -1 --format=%ct); now=$(date +%s)
          if [ $((now - last)) -gt 2592000 ]; then
            date -u +%Y-%m-%d > derniere-activite.txt
            git config user.name "veille-auto"
            git config user.email "veille-auto@users.noreply.github.com"
            git add derniere-activite.txt
            git commit -m "Activité mensuelle"
            git push
          fi
